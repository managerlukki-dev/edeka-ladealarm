
name: EDEKA Ladealarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  check-chargers:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    concurrency:
      group: edeka-ladealarm-status-check
      cancel-in-progress: false

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parser-Tests ausführen
        run: python -m unittest discover -s tests -v

      - name: Ladepunkte prüfen und Cloudflare benachrichtigen
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: python monitor.py

